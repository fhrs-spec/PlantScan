<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - PlantScan</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #0d1a08; display: flex; flex-direction: column; min-height: 100vh; }
    .admin-container { padding: 40px 20px; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .admin-header h1 { font-family: 'Lora', serif; font-size: 32px; color: white; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; text-align: center; }
    .stat-val { font-size: 36px; font-weight: 600; color: #4ade80; margin-bottom: 8px; }
    .stat-label { font-size: 14px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; }
    .table-container { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { color: rgba(255,255,255,0.5); font-weight: 500; font-size: 14px; }
    td { color: rgba(255,255,255,0.9); }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; color: white; text-decoration: none; padding: 10px 20px; background: rgba(255,255,255,0.1); border-radius: 30px; transition: 0.3s; }
    .btn-back:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>Admin Dashboard</h1>
      <a href="index.html" class="btn-back">← Kembali ke Web</a>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-val" id="stat-users">1</div>
        <div class="stat-label">Active Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-scans">0</div>
        <div class="stat-label">Total Scans</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">Active</div>
        <div class="stat-label">API Status</div>
      </div>
    </div>

    <div class="table-container">
      <h3>Recent Scans (Local History)</h3>
      <table style="margin-top:20px;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Plant</th>
            <th>Disease/Condition</th>
            <th>Severity</th>
          </tr>
        </thead>
        <tbody id="admin-table-body">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Load mock stats
      const users = localStorage.getItem('plantscan_user') ? 1 : 0;
      document.getElementById('stat-users').textContent = users;
      
      const history = JSON.parse(localStorage.getItem('plantscan_history') || '[]');
      document.getElementById('stat-scans').textContent = history.length;

      const tbody = document.getElementById('admin-table-body');
      if (history.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No recent scans found.</td></tr>';
      } else {
        tbody.innerHTML = history.map(item => {
          const date = new Date(item.date).toLocaleString();
          return `
            <tr>
              <td>${date}</td>
              <td>${item.plantEmoji} ${item.plantName}</td>
              <td>${item.diseaseName}</td>
              <td>${item.severity.toUpperCase()}</td>
            </tr>
          `;
        }).join('');
      }
    });
  </script>
</body>
</html>
